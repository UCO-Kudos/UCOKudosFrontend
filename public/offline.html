<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#083f75" />
    <title>Sin conexión · UCO Kudos</title>
    <style>
      body {
        margin: 0;
        min-height: 100dvh;
        display: flex;
        flex-direction: column;
        justify-content: center;
        gap: 16px;
        padding: max(24px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right))
          max(24px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left));
        box-sizing: border-box;
        font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
        font-size: 16px;
        line-height: 1.5;
        color: #1d2939;
        background: #ffffff;
        text-align: center;
      }
      h1 { font-size: 1.5rem; margin: 0; color: #083f75; }
      p { margin: 0 auto; max-width: 32rem; }
      button {
        min-height: 48px;
        width: 100%;
        max-width: 24rem;
        margin: 8px auto 0;
        border: 0;
        border-radius: 12px;
        font: inherit;
        font-weight: 600;
        color: #ffffff;
        background: #083f75;
      }
      button:focus-visible { outline: 3px solid #f5b700; outline-offset: 3px; }
    </style>
  </head>
  <body>
    <h1>Estás sin conexión</h1>
    <p>UCO Kudos necesita internet para iniciar sesión, publicar Kudos y recibir avisos.</p>
    <p>Revisa tus datos móviles o el Wi‑Fi y vuelve a intentarlo.</p>
    <button type="button" onclick="location.reload()">Reintentar</button>
  </body>
</html>
